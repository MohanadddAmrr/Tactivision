# ===========================================================================
# TactiVision Pro — Streamlit theme
# Dark palette inspired by sports analytics tools (StatsBomb, Opta)
# ===========================================================================

[theme]
base = "dark"
primaryColor = "#DA291C"               # Arsenal red accent
backgroundColor = "#0f172a"            # Deep slate (page background)
secondaryBackgroundColor = "#1e293b"   # Card / sidebar background
textColor = "#e2e8f0"                  # Light slate text
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
# Prevent accidental file-watcher crashes on large pre-computed asset directories
fileWatcherType = "none"

[client]
showErrorDetails = true
toolbarMode = "minimal"
